apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: devops-portfolio-rs
  labels:
    app: devops-portfolio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: devops-portfolio
  template:
    metadata:
      labels:
        app: devops-portfolio
    spec:
      containers:
        - name: devops-portfolio
          image: sriannamalai/devops-portfolio:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: devops-portfolio-service
  labels:
    app: devops-portfolio
spec:
  type: NodePort
  selector:
    app: devops-portfolio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080